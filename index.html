<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<title>健康计划 · 备孕打卡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
 --g:#2f7d6a;--g2:#3f9d84;--g3:#e6f2ed;
 --ink:#16231e;--ink2:#3f514a;--muted:#75857e;--line:#e9f0ec;
 --bg:#eef3f0;--card:#fff;--rose:#c05f73;--blue:#406f9c;--amber:#a9741f;
 --r:18px;
}
body{
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
 background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
 padding-bottom:calc(78px + env(safe-area-inset-bottom));
 -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
.appbar{
 position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
 padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
 background:rgba(243,247,245,.92);backdrop-filter:saturate(180%) blur(14px);
 -webkit-backdrop-filter:saturate(180%) blur(14px);
 border-bottom:1px solid rgba(20,50,40,.06);
}
.appbar .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;flex:none}
.appbar h1{font-size:16.5px;font-weight:650;letter-spacing:.01em;line-height:1.2}
.appbar h1 span{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.appbar .iconbtn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center}
#view{min-height:calc(100vh - 150px)}

/* ---------- hero ---------- */
.hero{
 margin:12px 12px 0;border-radius:24px;padding:18px 18px 16px;color:#fff;
 background:radial-gradient(120% 90% at 100% 0%,#5bb397 0%,#3f9d84 45%,#2c7a66 100%);
 box-shadow:0 14px 30px rgba(40,110,90,.22);
}
.hrow1{display:flex;align-items:center;gap:8px}
.harrow{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:19px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.harrow:disabled{opacity:.4}
.hmid{flex:1;text-align:center}
.hdate{font-size:13px;font-weight:600;letter-spacing:.04em;opacity:.95}
.hday{font-size:11.5px;opacity:.72;margin-top:1px}
.hnum{display:flex;align-items:baseline;gap:6px;margin-top:14px}
.hnum b{font-size:44px;line-height:1;font-weight:750;letter-spacing:-.02em}
.hnum span{font-size:13px;opacity:.75}
.hbadge{margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);align-self:center}
.hbadge.ok{background:#fff;color:var(--g)}
.hbar{height:7px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:12px}
.hbar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .28s ease}
.hsub{font-size:11.5px;opacity:.78;margin-top:7px}
.seg{display:flex;gap:6px;background:rgba(255,255,255,.14);border-radius:14px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.85);border-radius:11px;padding:7px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.seg button b{font-size:11.5px;font-weight:600;opacity:.8}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg button.on b{opacity:.65}

/* ---------- layout ---------- */
.wrap{padding:0 12px 28px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;margin:20px 4px 8px}
.sechead h2{font-size:14px;font-weight:650;letter-spacing:.01em}
.sechead span{font-size:11.5px;color:var(--muted)}
.swap{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--g);box-shadow:0 1px 3px rgba(20,50,40,.04)}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(20,50,40,.04),0 8px 22px rgba(20,50,40,.05);margin-bottom:12px;overflow:hidden}
.card.pad{padding:15px}
.pagehead{padding:18px 4px 6px}
.pagehead h1{font-size:22px;font-weight:750;letter-spacing:-.01em}
.pagehead p{font-size:12.5px;color:var(--muted);margin-top:5px}
.pbar{height:8px;border-radius:99px;background:#e3ece8;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g),var(--g2))}

/* ---------- check rows ---------- */
.row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 15px;min-height:58px}
.row:last-child{border-bottom:0}
.row:active{background:#f7faf8}
.box{width:26px;height:26px;border-radius:50%;border:1.6px solid #cfdcd6;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .16s ease;background:#fff}
.box svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:all .16s ease;color:#fff}
.row[aria-pressed="true"] .box{background:var(--g);border-color:var(--g)}
.row[aria-pressed="true"] .box svg{opacity:1;transform:scale(1)}
.rowtx{flex:1;min-width:0}
.rowl{display:block;font-size:14.5px;font-weight:560;line-height:1.42;transition:color .16s}
.rowh{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.row[aria-pressed="true"] .rowl{color:#7d8c86;font-weight:500}
.row[aria-pressed="true"] .rowh{color:#a3b0aa}
.rowtag{flex:none;font-size:10px;font-weight:650;color:var(--g);background:var(--g3);padding:2px 7px;border-radius:7px;margin-top:2px}

/* ---------- check rows · 渐进披露（标题常驻，说明按需展开） ---------- */
.ck{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ckmain{display:flex;align-items:center;gap:12px;width:100%;min-width:0;text-align:left;background:none;border:0;padding:12px 6px 12px 15px;min-height:52px}
button.ckmain:active{background:#f7faf8}
.ck .rowl{flex:1;min-width:0;font-size:14.5px;font-weight:560;line-height:1.42;transition:color .16s}
.ck[aria-pressed="true"] .box{background:var(--g);border-color:var(--g)}
.ck[aria-pressed="true"] .box svg{opacity:1;transform:scale(1)}
.ck[aria-pressed="true"] .rowl{color:#7d8c86;font-weight:500}
.ckinfo{flex:none;width:30px;height:30px;margin:0 10px 0 0;border:0;background:none;color:#c2cec8;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.ckinfo svg{width:17px;height:17px;stroke-width:1.7}
.ckinfo:active{background:#eef3f0}
.ckinfo.open{color:var(--g);background:var(--g3)}
.ckh{grid-column:1 / -1;display:none;font-size:11.5px;color:var(--muted);line-height:1.5;padding:0 16px 12px 53px;margin-top:-2px}
.ckh.open{display:block}
.ck[aria-pressed="true"] .ckh{color:#a3b0aa}
.ck.ro .ckmain{cursor:default;background:#fbfdfc}
.ck.ro .rowl{color:#5f6f68}
.ck.ro[aria-pressed="true"] .box{opacity:.82}

/* ---------- collapsible section · 渐进披露（次要内容默认收起） ---------- */
.fhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 15px;min-height:50px}
.fhead:active{background:#f7faf8}
.fhead .fhtx{flex:1;min-width:0}
.fhead .fhtx b{display:block;font-size:13.5px;font-weight:650;color:var(--ink)}
.fhead .fhtx span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.fhead .chev{flex:none;font-size:16px;color:#a3b0aa}
.fbody{display:none;border-top:1px solid var(--line)}
.fbody.open{display:block}

/* ---------- week strip ---------- */
.weekcard{padding:12px 10px 10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:3px 0;font-size:10.5px;color:#93a29c;border-radius:12px}
.day i{width:32px;height:32px;border-radius:50%;background:#f4f8f6;border:1.5px solid #e6eeea;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:#6e7f78;transition:all .2s}
.day.l1 i{background:#dcefe7;border-color:#c8e7da;color:#2f7d6a}
.day.l2 i{background:#a9dcc9;border-color:#93d2bc;color:#fff}
.day.l3 i{background:var(--g);border-color:var(--g);color:#fff}
.day.sel i{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--g)}
.day.today{color:var(--g);font-weight:650}

/* ---------- weight ---------- */
.wcard{padding:15px}
.wrow{display:flex;align-items:center;gap:12px}
.wleft{flex:1;min-width:0}
.klabel{font-size:11.5px;color:var(--muted)}
.wbig{font-size:30px;font-weight:750;line-height:1.15;letter-spacing:-.02em;margin-top:1px}
.wbig i{font-size:12px;font-weight:500;font-style:normal;color:var(--muted);margin-left:3px}
.wsub{font-size:11px;color:var(--muted);margin-top:2px}
.winput{display:flex;gap:6px;align-items:center}
.winput input{width:74px;border:1px solid var(--line);background:#f7faf8;border-radius:11px;padding:9px 10px;font-size:14px;text-align:center;outline:none}
.winput input:focus{border-color:var(--g2);background:#fff}
.winput button{border:0;background:var(--g);color:#fff;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600}

/* ---------- note ---------- */
.notecard{padding:12px 14px}
.notecard textarea{width:100%;border:0;background:transparent;resize:none;min-height:64px;outline:none;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.notecard textarea::placeholder{color:#a8b5af}

/* ---------- plan ---------- */
.phase-h{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:0;padding:15px}
.phase-n{width:26px;height:26px;border-radius:9px;background:var(--g3);color:var(--g);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.phase-tx{flex:1;min-width:0}
.phase-tx h3{font-size:14px;font-weight:650;line-height:1.4}
.phase-tx p{font-size:11.5px;color:var(--muted);margin-top:3px}
.phase-h .chev{margin-top:3px}
.chev{display:inline-block;transition:transform .2s;color:#a3b0aa;font-size:16px;margin-left:2px}
.open>.chev,.link.open .chev{transform:rotate(90deg)}
.phase-b{display:none;border-top:1px solid var(--line)}
.phase-b.open{display:block}
.phase-b .row{padding-left:46px;min-height:50px}
.phase-b .rowl{font-size:13.5px}
.phase-b .box{width:22px;height:22px}
.phase-b .box svg{width:13px;height:13px}
.phase-b .row[aria-pressed="true"] .rowl{text-decoration:line-through;text-decoration-color:#c9d6d0}

/* ---------- folds / report ---------- */
.link{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:12px 0 2px;font-size:12.5px;font-weight:600;color:var(--g);text-align:left}
.fold{display:none;padding-top:10px}
.fold.open{display:block}
.evid{background:#f6f9f7;border:1px solid #edf2ef;border-radius:11px;padding:10px 12px;font-size:11.5px;line-height:1.6;color:#5f706a}
.acts{margin:10px 0 0;padding:0 0 0 2px;list-style:none}
.acts li{position:relative;padding:0 0 0 18px;margin-bottom:7px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.acts li:before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--g2)}
.find{padding:15px}
.find h3{font-size:15px;font-weight:650;line-height:1.45;margin-top:8px}
.find .w{font-size:12.8px;line-height:1.62;color:#53645d;margin-top:7px}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.p-f{background:#fbe9ed;color:var(--rose)}
.p-m{background:#e8f0f8;color:var(--blue)}
.p-p{background:#eee9f7;color:#6a55a0}
.p-high{background:#fde8e6;color:#b4402f}
.p-mid{background:#fdf1dc;color:var(--amber)}
.p-low{background:#eef1f0;color:#6d7b75}
.p-good{background:#e3f3ea;color:#2b7a52}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:560}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}

/* ---------- cycle ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f7faf8;border-radius:13px;padding:11px 12px}
.stat .n{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:2px}
.form{display:flex;flex-direction:column;gap:10px;padding:15px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);background:#f7faf8;border-radius:11px;padding:10px 11px;font-size:14px;outline:none;width:100%}
.form input:focus,.form select:focus{border-color:var(--g2);background:#fff}
.primary{border:0;background:var(--g);color:#fff;border-radius:12px;padding:12px;font-size:14px;font-weight:650;margin-top:2px}
.record{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line)}
.record:last-child{border-bottom:0}
.record .rd{font-size:11.5px;color:var(--muted);width:62px;flex:none}
.record .rt{font-size:12.5px;font-weight:600;flex:none;width:66px}
.record .rv{flex:1;font-size:12.5px;color:var(--ink2);min-width:0}
.del{border:0;background:#f4f7f5;color:#93a29c;border-radius:8px;padding:4px 8px;font-size:11px}

/* ---------- diet ---------- */
.meals{padding:13px 15px}
.meals .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.meals .mh b{font-size:13px}
.meals .mh button{border:0;background:none;color:var(--g);font-size:11.5px;font-weight:650;padding:2px 0}
.meal{display:flex;gap:9px;padding:5px 0;font-size:12.4px;line-height:1.5;color:var(--ink2)}
.meal em{flex:none;font-style:normal;font-weight:750;color:var(--g);width:15px;font-size:12px}
.meal span{flex:1;min-width:0}
.dtab{display:flex;gap:6px;overflow-x:auto;padding:1px 0 10px;scrollbar-width:none}
.dtab::-webkit-scrollbar{display:none}
.dtab button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:10px;padding:7px 12px;font-size:12px}
.dtab button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:650}
.dish{padding:12px 15px;border-bottom:1px solid var(--line)}
.dish:last-child{border-bottom:0}
.dish h4{font-size:13.5px;font-weight:650;line-height:1.4;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.dish .today-tag{font-size:9.5px;font-weight:700;color:#fff;background:var(--g2);padding:1px 6px;border-radius:6px}
.dish .di{font-size:11.3px;color:var(--muted);margin-top:3px;line-height:1.5}
.dish .how{font-size:12.2px;color:var(--ink2);line-height:1.58;margin-top:4px}
.dish .kcal{font-size:10.5px;color:var(--g);font-weight:600;margin-top:4px}
.dish .dy{font-size:10.5px;color:var(--muted);font-weight:600;flex:none}
.dishbtn{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;width:100%;text-align:left;background:none;border:0;padding:0;font-size:13.5px;font-weight:650;line-height:1.4;color:var(--ink)}
.dishbtn .chev{margin-left:auto;font-weight:400}
.dishbtn.open .chev{transform:rotate(90deg)}
.mcard{padding:14px 15px}
.mcard h3{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.mcard h3 span{font-size:10.5px;font-weight:700;color:var(--g);background:var(--g3);padding:2px 8px;border-radius:99px}
.mcard p{font-size:12.3px;color:var(--ink2);line-height:1.6;margin-top:6px}

/* ---------- more ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px}
.stats3 .s{text-align:center}
.stats3 .s b{display:block;font-size:22px;font-weight:750;letter-spacing:-.02em}
.stats3 .s span{font-size:10.5px;color:var(--muted)}
.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 15px;min-height:60px}
.menu:last-child{border-bottom:0}
.menu .mi{width:36px;height:36px;border-radius:11px;background:var(--g3);color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.menu .mi svg{width:19px;height:19px}
.menu .mt{flex:1;min-width:0}
.menu .mt b{display:block;font-size:14px;font-weight:600}
.menu .mt span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.menu .mc{font-size:11px;color:var(--muted);flex:none}
.datarow{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 15px}
.btn2{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:560;color:var(--ink2);flex:1;min-width:104px}
.btn2.danger{color:#b4402f;border-color:#f0d6d1;background:#fdf7f6}
.foot{text-align:center;font-size:10.5px;color:#a3b0aa;padding:18px 0 6px;line-height:1.6}

/* ---------- sub view ---------- */
.subhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:10;background:linear-gradient(#eef3f0 70%,rgba(238,243,240,0))}
.subhead button{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink2);flex:none;padding-bottom:2px}
.subhead h2{font-size:17px;font-weight:700}
.subhead .swap{width:auto;height:auto;border-radius:99px;padding:5px 11px;font-size:11.5px;white-space:nowrap}
.test{padding:14px 15px}
.test h3{font-size:14px;font-weight:650;line-height:1.4;margin-top:6px}
.test .meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.55}
.test .why{font-size:12.3px;color:#53645d;line-height:1.55;margin-top:6px}
.tstat{display:flex;gap:6px;background:#f5f8f6;border-radius:11px;padding:3px;margin-top:11px}
.tstat button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 2px;font-size:11.5px;color:var(--muted)}
.tstat button.on{background:#fff;color:var(--g);font-weight:650;box-shadow:0 1px 4px rgba(20,50,40,.08)}
.tres{margin-top:8px;width:100%;border:1px solid var(--line);background:#f7faf8;border-radius:10px;padding:9px 11px;font-size:12.5px;outline:none}
.qa{padding:12px 0;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0}
.qa .q{font-size:13.5px;font-weight:600;line-height:1.5}
.qa .r{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.dept{font-size:12px;font-weight:700;color:var(--g);letter-spacing:.02em}
.about{font-size:12.8px;line-height:1.65;color:var(--ink2)}
.about b{color:var(--ink)}
.about p+p{margin-top:9px}
.about ul{margin:8px 0 0;padding-left:18px}

/* ---------- role gate ---------- */
.gate{padding:34px 18px 40px;max-width:520px;margin:0 auto}
.gate .gmark{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;box-shadow:0 10px 24px rgba(40,110,90,.22)}

.rolecard:active{background:#fafcfb}
.ravatar{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
.ravatar.f{background:#fbe9ed;color:var(--rose)}
.ravatar.m{background:#e8f0f8;color:var(--blue)}
.rolecard .rtx{flex:1;min-width:0}
.rolecard .rtx b{display:block;font-size:16px;font-weight:650}
.rolecard .rtx span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.rolecard .rgo{color:#a3b0aa;font-size:18px;flex:none}

.gfoot{font-size:11px;color:#93a29c;line-height:1.6;margin-top:16px;text-align:center}
.appbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.appbar .appbar-right .iconbtn{margin-left:0}
.rolechip{display:none;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;color:var(--g);border-radius:99px;padding:7px 11px;font-size:12px;font-weight:650}

/* read-only view */
.row.ro{cursor:default;background:#fbfdfc}

/* 访问口令 */
.lockgate{padding-top:54px}
.lockbox{display:flex;gap:8px;margin:20px 0 4px}
.lockbox input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:19px;letter-spacing:.32em;text-align:center;outline:none}
.lockbox input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(63,157,132,.12)}

/* ---------- tabbar ---------- */
.tabbar{
 position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
 background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
 border-top:1px solid #e4ece8;padding:5px 4px calc(5px + env(safe-area-inset-bottom));
}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;font-size:10px;color:#93a29c;border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke-width:1.7}
.tabbar button.on{color:var(--g);font-weight:650}
.tabbar button.on svg{stroke-width:2.05}

/* ---------- meal photo / AI ---------- */
.mealcard{padding:14px 15px}
.mtop{display:flex;gap:12px;align-items:flex-start}

.mtitle .tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--g3);color:var(--g);flex:none}
.mtitle .tag.demo{background:#fdf1dc;color:var(--amber)}
.mtitle .tag.manual{background:#eef1f0;color:#6d7b75}
.mplan{font-size:11px;color:var(--muted);line-height:1.5;margin-top:3px}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

.mact button.danger{color:#b4402f;border-color:#f0d6d1;background:#fdf7f6}

.mres{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
.mkcal{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.mkcal b{font-size:27px;font-weight:750;letter-spacing:-.02em;line-height:1}
.mkcal span{font-size:11px;color:var(--muted)}
.mmac{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mmac span{font-size:10.8px;color:var(--ink2);background:#f6f9f7;border-radius:8px;padding:3px 7px}
.mmicro{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.mmicro div{display:flex;justify-content:space-between;gap:6px;font-size:10.6px;color:var(--muted);border-bottom:1px dotted #e6eeea;padding-bottom:3px}

.mcmt{margin:8px 0 0;padding:0;list-style:none}

.mcmt li:before{content:"";position:absolute;left:2px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--g2)}
.mconf{font-size:10px;color:#93a29c;margin-top:7px;line-height:1.5}
.mscale{display:flex;gap:5px;margin-top:8px}
.mscale button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 2px;font-size:10.5px;color:var(--muted)}
.mscale button.on{background:var(--g3);border-color:#bfe0d3;color:var(--g);font-weight:650}
.msum{padding:15px}
.msum .big{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.msum .big b{font-size:31px;font-weight:750;letter-spacing:-.02em;line-height:1}
.msum .big span{font-size:11px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.mbar .lab{display:flex;justify-content:space-between;gap:5px;font-size:10.2px;color:var(--muted);margin-bottom:3px}
.mbar .lab b{font-weight:600;color:var(--ink2);white-space:nowrap}
.mbar .tr{height:6px;border-radius:99px;background:#eaf1ed;overflow:hidden}
.mbar .tr i{display:block;height:100%;border-radius:99px;background:var(--g2)}
.mbar .tr i.hi{background:var(--amber)}
.mbar .tr i.lo{background:#9db7e0}
.mdots{display:flex;gap:5px;margin-top:8px}
.mdots span{flex:1;text-align:center;font-size:10px;color:#93a29c;background:#f4f8f6;border-radius:7px;padding:4px 0}
.mdots span.on{background:var(--g3);color:var(--g);font-weight:650}
.mtrend{padding:14px 15px}
.mtrend .bars{display:flex;align-items:flex-end;gap:6px;height:88px;margin-top:8px}
.mtrend .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;background:none;border:0;padding:0;min-width:0}
.mtrend .b b{font-size:8.5px;font-weight:600;color:var(--muted);line-height:1}
.mtrend .b i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:#e3ece8;min-height:3px}
.mtrend .b.has i{background:var(--g2)}
.mtrend .b span{font-size:9px;color:#a3b0aa;line-height:1}
.mtrend .b.sel span{color:var(--g);font-weight:650}
.mtabs{display:flex;gap:6px;margin:2px 0 10px}
.mtabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-size:11.5px;color:var(--muted)}
.mtabs button.on{background:var(--g3);border-color:#bfe0d3;color:var(--g);font-weight:650}
.aiwarn{background:#fdf7ef;border:1px solid #f2e3cc;border-radius:11px;padding:10px 12px;font-size:11.3px;line-height:1.55;color:#7a5a2a}
.aicard{padding:15px}
.aicard label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);margin-top:10px}
.aicard input,.aicard select{border:1px solid var(--line);background:#f7faf8;border-radius:11px;padding:10px 11px;font-size:13.5px;outline:none;width:100%}
.aicard input:focus{border-color:var(--g2);background:#fff}
.aicard .primary{margin-top:12px}
.aistat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;padding:3px 8px;border-radius:99px;background:var(--g3);color:var(--g)}
.aistat.off{background:#f1f4f2;color:#93a29c}
.manualform{border-top:1px solid var(--line);margin-top:11px;padding-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.manualform label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted)}
.manualform input{border:1px solid var(--line);background:#f7faf8;border-radius:8px;padding:7px 8px;font-size:12px;outline:none;width:100%}
.manualform .wide{grid-column:1/-1}
.manualform .row2{grid-column:1/-1;display:flex;gap:6px}
.manualform .row2 button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:12px;font-weight:600}
.manualform .row2 button.pri{background:var(--g);border-color:var(--g);color:#fff}

 .appbar,.tabbar,.noprint,.chiprow{display:none!important}

 .fold,.phase-b{display:block!important}
 .card{box-shadow:none;border:1px solid #e2e2e2;break-inside:avoid}
 .subhead{position:static}
}

<script>
"use strict";
/* ============ 数据（来自现有备孕计划，勿手改结构） ============ */
var FINDINGS=[
/* ---- 女方 · 高优先级 ---- */
{who:"f",pri:"high",t:"多囊卵巢综合征（PCOS）——本次备孕最主要要处理的一件事",
 d:"报告依据：性激素六项（2025-12-09，临床诊断栏写明「多囊卵巢综合征」）LH 4.52 / FSH 4.19 / 睾酮 1.16 / 孕酮 0.780；AMH 4.05 ng/ml（正常）",
 w:"通俗讲：卵巢里的小卵泡很多，但不容易有一个长熟并排出来。后果是月经周期拖长、排卵不规律——不排卵的那个月，同房再多也不会怀上。好消息是 AMH 4.05 说明卵子库存充足，PCOS 是不排卵里最好解决的一类。",
 a:["从今天开始记录月经日期和排卵迹象（试纸 + 宫颈黏液），先搞清楚她到底是不是每个月都排卵","减重 5%–10% 是让 PCOS 恢复自发排卵最有效的一招，比任何保健品都管用","挂妇科内分泌或生殖医学科，把体重、血糖、泌乳素三件事一起交给医生评估；若确认稀发排卵，医生可能安排促排卵（来曲唑是 PCOS 的一线方案）——这类药必须由医生开、配合 B 超监测，绝对不要自行购买服用"]},

{who:"f",pri:"high",t:"胰岛素抵抗 + 糖耐量受损（这是全套报告里最值得重视的指标）",
 d:"报告依据：OGTT 餐后 2 小时血糖 9.53↑ mmol/L（参考 3.90–7.80）；餐后 2 小时胰岛素 3196.73 pmol/L（极高）；空腹胰岛素 110.12 pmol/L；临床诊断栏写明「胰岛素抵抗」，正在服用二甲双胍",
 w:"通俗讲：身体对胰岛素不敏感，胰腺只能拼命加班分泌，血糖才勉强压住。2 小时血糖 9.53 属于「糖耐量受损」——还没到糖尿病，但已经越线。为什么备孕期要紧：① 高胰岛素会加重 PCOS 的排卵障碍；② 受孕前后血糖偏高会提高早期流产和胎儿发育异常的风险；③ 孕前有胰岛素抵抗，孕期发生妊娠糖尿病的概率明显升高。这一项是可以通过体重和饮食真正逆转的。",
 a:["内分泌科或生殖科复诊，带上这两张化验单，明确问：备孕期二甲双胍是否继续吃、剂量多少、发现怀孕后要不要停（这三个问题的答案只能由医生给）","补查糖化血红蛋白 HbA1c（报告里缺这个指标，而它是判断近 3 个月血糖控制水平的关键）","把「戒含糖饮料和奶茶、晚餐提前、餐后散步 15–20 分钟」当成治疗手段执行，而不只是养生建议","长期服二甲双胍会影响维生素 B12 吸收，复查时顺便查一次 B12"]},

{who:"f",pri:"high",t:"体重指数 27.34，属于超重（婚检建议：孕前科学减重）",
 d:"报告依据：本人补充（2026-11-02）身高约 160cm、体重约 70kg → BMI = 70 ÷ 1.6² = 27.3，与报告记录 27.34 一致；婚前检查/孕前评估结论（2026-07-24，主检医师）原文——「体重指数偏高（肥胖前期）：27.34kg/m² 高于 18.5–23.9 正常值……建议在准备生育前积极锻炼身体，加强饮食控制平衡膳食，少吃油腻食物，科学减重」；同时超声提示脂肪肝",
 w:"通俗讲：超重不是影响外观，而是它同时拖累了三件事——排卵、血糖、肝功能。减重是这份计划里性价比最高的动作：减掉原体重的 5%（比如 70kg 减 3.5kg）就能看到月经周期改善，减 10% 效果更明显。而且减重后怀孕，妊娠糖尿病、妊娠高血压、巨大儿的风险都会同步下降。",
 a:["3 个月目标：减掉体重的 5%–10%，也就是 约 70kg → 66.5kg（−5%）到 63kg（−10%），速度控制在每周 0.5–1kg，不要更快","长期目标：降到 61kg 左右（BMI 24 以下），不必一步到位——先完成 3 个月的 3.5–7kg","不要节食、不要断碳水、不要代餐替代全部正餐——能量摄入过低本身会抑制排卵，也会让肌肉流失","每周一早上空腹、同一秤、同一状态称体重并记在「每日打卡」页里，看趋势不看单日","腰围也一起量（沿肚脐水平），比体重更能反映内脏脂肪"]},

{who:"f",pri:"high",t:"泌乳素两次升高（720.60、789.92 mIU/L）",
 d:"报告依据：性激素两次（2025-08-20 泌乳素 720.60；2025-12-09 泌乳素 789.92↑，参考 118.72–551.20）；同期甲功均正常",
 w:"通俗讲：泌乳素是多巴胺管着的「抑性激素」，它高了会压制下丘脑-垂体-卵巢轴，导致排卵减少、月经稀发，甚至溢乳。她的数值属于轻中度升高，常见原因有好几种：抽血状态不规范、某些药物（如多潘立酮/吗丁啉、部分胃药和情绪类用药）、甲减（她甲功正常，可排除）、少数情况是垂体泌乳素瘤。这个原因列表里大部分都能处理，且处理后排卵往往恢复得比较快。",
 a:["规范复查一次：上午 9–11 点、起床后至少 2 小时、静坐 30 分钟后抽血，前一晚避免性生活、乳房刺激、剧烈运动和熬夜；一次升高不能下结论","复查时同时查「巨泌乳素」（大分子泌乳素常被误判为异常，临床不需要治疗）","把复查前 3 个月吃过的所有药和保健品列一张单子给医生看","若持续升高，医生可能建议垂体 MRI 或用溴隐亭/卡麦角林；这类药吃多久、发现怀孕后能否继续，遵医嘱","自查症状：如有头痛、视野变窄、非哺乳期溢乳，尽快告诉医生"]},

{who:"f",pri:"high",t:"弓形虫抗体全阴 + 家里接触猫狗 = 易感人群（婚检医生专门提示）",
 d:"报告依据：TORCH 十项弓形虫 IgM 0.04、IgG <0.60 均阴性；婚检建议原文——「女方接触猫狗等家畜、宠物，弓形虫 IgG 阴性、IgM 阴性，从未感染弓形虫，属于易感人群……建议孕前孕期尽量避免接触猫狗等家畜、宠物」",
 w:"通俗讲：她体内没有弓形虫抗体，意味着怀孕期间初次感染的风险存在，而孕早期初次感染对胎儿危害最大。注意重点是「避免感染」，不是「把宠物送走」——真正的主要传染源其实是生肉、没洗干净的蔬果和被污染的水土，宠物只是其中一条路径，而且可以切断。",
 a:["猫砂改由男方每天清理（弓形虫卵囊在猫砂里要 1–5 天才具感染性，每天清掉就没机会）；必须自己清时戴手套、之后认真洗手","猫完全室内饲养、不喂生肉/生内脏、不捕食野生鼠鸟；狗的日常接触风险低，正常抚摸洗手即可","肉类彻底做熟（中心温度不再有粉色），不吃三分熟牛排、生鱼片、溏心蛋可保留但肉要熟","生熟砧板刀具分开；蔬果流水搓洗干净；园艺和接触泥土时戴手套，之后洗手","不接触流浪猫和动物粪便；孕期不接触羊肉和未巴氏消毒的奶制品","如果计划怀孕前无法确认家中宠物状况，可让宠物去医院做一次弓形虫检测，比猜测更省心","男方不必专门查弓形虫：男方感染不会通过精子传给孩子，先天性弓形虫只来自母亲孕期的初次感染；但如果他近期确诊感染或发过高烧，精液分析往后推 2–3 个月再做，结果更可靠","鱼和龟都不会传播弓形虫——弓形虫只在猫科动物体内完成有性繁殖、排出卵囊，其他动物都是「死胡同」。但龟和鱼缸水是沙门菌、分枝杆菌的来源：换水洗缸戴手套、别在厨房水槽洗、手上有机口别泡缸水，孕期和宝宝出生后这些活都交给男方"]},

{who:"f",pri:"mid",t:"维生素 D 不足（22.26 ng/mL）",
 d:"报告依据：25-OH 维生素 D 22.26↓ ng/mL（D2 0.35、D3 21.91；20.01–30.00 为不足）",
 w:"通俗讲：25(OH)D 在 20 以下是缺乏、20–30 是不足、30 以上比较理想。维生素 D 参与生殖激素调节和钙吸收，不足在备孕和孕期都很常见，也容易同时影响情绪和睡眠。",
 a:["按医生意见补充，常见做法是每日 1000–2000 IU 普通维生素 D3，3 个月后复查，目标是升到 30 ng/mL 以上；不要自行吃超大剂量","每天户外 15–20 分钟晒太阳（手臂小腿露出来），这和散步可以合并成一件事","注意：维生素 D 不是越多越好，每日总量别超过 4000 IU，除非医生明确要求"]},

{who:"f",pri:"mid",t:"脂肪肝 + 肝功能曾异常（现已恢复正常）",
 d:"报告依据：超声结论脂肪肝、肝囊肿 0.6×0.5cm；生化全套（2025-08-20）ALT 74↑、AST 58↑；婚检复查（2026-07-22）ALT 21.9 已正常；空腹血糖 5.56→4.76",
 w:"通俗讲：一年前肝功能是异常的，现在恢复正常，这说明生活方式干预已经见效，是很积极的信号。脂肪肝本身可逆，但怀孕会加重肝脏负担，所以孕前把它稳住很重要。肝囊肿 0.6cm 属于极小的良性病变，不用紧张。",
 a:["减重和控糖同时也在治脂肪肝，不需要额外「护肝」保健品——很多保健品反而加重肝脏负担","孕前每 2–3 个月复查一次肝功能，确认转氨酶稳定","避免饮酒（备孕和孕期零酒精）、避免不必要的用药和「排毒/护肝」类产品","肝囊肿按婚检建议 6–12 个月复查一次 B 超即可"]},

{who:"f",pri:"mid",t:"红细胞 5.13 偏高 + 平均血红蛋白含量 26.3 偏低（婚检医生要求复查）",
 d:"报告依据：血常规（2026-07-22）红细胞 5.13×10¹²/L 偏高、MCH 26.3↓ pg（参考 27.0–33.0）、血红蛋白 135 正常、平均红细胞体积未见明显异常；婚检建议原文——「血细胞分析-红细胞偏高：建议复查，如仍有异常，建议在怀孕前到正规医院内科就诊进一步检查」",
 w:"通俗讲：血红蛋白正常、但红细胞数量偏多而每个红细胞里的血红蛋白偏少，这个组合有两种常见解释：一种是缺铁早期，另一种是「地中海贫血基因携带」（轻型携带者没有任何症状，只在血常规上表现为这一组合）。这两件事的处理完全不同，所以需要一项检查把它们分开。这一点值得在怀孕前弄清楚：如果女方是地贫携带者，男方必须补做同样的筛查——只有双方携带同型基因才会影响胎儿，那种情况医生有明确的产前诊断路径。",
 a:["查血清铁蛋白（区分缺铁还是不缺铁）、查血红蛋白电泳；如电泳异常再做地贫基因检测","如果女方确认为携带者，男方加做血红蛋白电泳 + 地贫筛查（男方目前血常规正常，概率不高，但流程上要确认）","不要在没有铁蛋白结果前自行吃铁剂——缺铁和地贫携带的处理方式相反","这是门诊必问项，已写进「门诊提问」页"]},

{who:"f",pri:"mid",t:"肌酸激酶 1403 明显升高（2025-08，需闭环复查）",
 d:"报告依据：生化全套（2025-08-20）肌酸激酶 1403↑；同次 ALT 74↑、AST 58↑、磷 0.73↓；2026-07 复查的婚检生化只含 ALT/血糖/肌酐，未复查 CK",
 w:"通俗讲：CK 主要来自肌肉，最常见的升高原因是检查前大强度运动、肌肉劳损、按摩或肌肉注射，也可能与某些药物或肌肉疾病有关。它本身不影响怀孕，但一个从未解释清楚的异常值应该闭环，而不是留在报告里。",
 a:["复查一次 CK + 乳酸脱氢酶：复查前 3 天避免大强度运动、剧烈按摩、肌肉注射","复查时如仍有明显升高，或出现肌肉酸痛无力、上楼困难、尿色变深（酱油色/浓茶色），尽快到内科或神经内科就诊","如果当时抽血的时机正好在剧烈运动后，把这个情况告诉医生，有助于解释"]},

{who:"f",pri:"low",t:"血小板压积 0.33 轻度偏高（通常没有临床意义）",
 d:"报告依据：血常规（2026-07-22）血小板压积 0.33↑（参考 0.10–0.25），血小板计数 292 正常（100–300）",
 w:"通俗讲：血小板压积 = 血小板数量 × 平均体积 算出来的派生值，本身不单独用于诊断。她的血小板计数正常，这个箭头几乎可以忽略，常见原因是饮水少、血液轻微浓缩或测量波动。",
 a:["不需要特别处理，随常规血常规复查即可","日常多喝水（每天 1500–2000ml），避免长时间不喝水"]},

{who:"f",pri:"good",t:"风疹 IgG 阳性 = 已有免疫力，不用打疫苗（省掉 3 个月等待）",
 d:"报告依据：TORCH（2025-12-24）风疹 IgG 26.28↑、IgM 阴性；优生六项（2026-07-23）风疹 IgG 28.40↑、IgM 阴性；婚检意见原文——「风疹病毒 IgG 阳性、IgM 阴性，表示既往有过风疹病毒感染，目前无异常，可以正常备孕」",
 w:"通俗讲：这是这次备孕里最实在的一个好消息。风疹在孕早期感染会导致胎儿严重畸形，所以没有免疫的女性需要接种麻腮风疫苗并推迟怀孕（国内说明普遍建议接种后 3 个月内避孕）。她已经有抗体，这一条完全不用考虑，可以直接进入备孕。",
 a:["不需要接种风疹疫苗，不需要因此推迟怀孕","保留这个结论，怀孕后不必重复查"]},

{who:"f",pri:"good",t:"卵巢储备正常（AMH 4.05）、甲功正常、宫颈正常、感染四项全阴、自身抗体全阴",
 d:"报告依据：AMH 4.05 ng/ml（2025-12-23）；甲功两轮 TSH 2.21 / 2.43 / 2.51、FT4 正常、TPOAb<8、TgAb<12 阴性；宫颈 TCT 结论 NILM（良性反应性细胞改变-炎症）、HPV 23 项全阴性；衣原体/淋球菌/梅毒 TRUST/HIV 全阴；乙肝表面抗体阳性、表面抗原阴性；抗核抗体 16 项全阴；叶酸 25.19 正常、叶酸代谢基因低风险；血型 O 型 Rh 阳性",
 w:"通俗讲：32 岁这个年龄，很多女性要担心卵子库存、甲状腺、宫颈问题——她的报告这些都没问题。甲功正常尤其重要，孕期对甲状腺激素需求会上升，孕前基础好是明显优势。抗核抗体全阴说明没有那种「反复早期流产相关的自身免疫因素」。乙肝表面抗体阳性是有抵抗力（疫苗效果），不是感染。双方都是 O 型 Rh 阳性，不存在 Rh 血型不合导致的溶血风险。",
 a:["以上项目都不需要在怀孕前重复花钱复查（除非医生另有要求）","TSH 在 2.4–2.5 之间：有些生殖门诊希望备孕女性 TSH 控制在 2.5 以下，她正好在这个边界上。把三次结果拿给医生看、由医生判断是否需要处理即可，不要自行服用任何甲状腺药物","叶酸代谢基因是低风险、MTHFR C677T 只是 C/T 杂合（很常见），意味着按标准剂量补叶酸就够了，不需要自行买 5mg 大剂量叶酸"]},

{who:"f",pri:"low",t:"单纯疱疹 HSV-1、巨细胞病毒 CMV IgG 阳性（既往感染，很普遍）",
 d:"报告依据：TORCH HSV-1 IgG 19.23↑、CMV IgG 130.87 / 157.92↑，相应 IgM 均阴性",
 w:"通俗讲：这两个都是「以前接触过、现在不是急性期」的标志，中国成年人群绝大多数都是阳性，不代表目前有活动性感染，也不构成备孕障碍。",
 a:["不需要治疗，不影响备孕节奏","CMV 主要经幼儿唾液和尿液传播：如果家里或工作中接触 3 岁以下幼儿，吃饭前洗手、不共用餐具和亲吻嘴唇，是有效的日常防护","孕期如出现发热、皮疹、明显乏力，及时告知产科医生"]},

/* ---- 男方 ---- */
{who:"m",pri:"high",t:"精液分析还没做——男方这边最关键的一项检查缺口",
 d:"报告依据：男方婚检 8 页截图仅含血常规（2026-07-22）、尿常规、婚检生化（ALT 17.5 / 空腹血糖 4.63 / 肌酐 83.6）、传染病免疫（梅毒/HIV/乙肝五项）、淋球菌涂片、血型（O 型 Rh 阳性）。全部正常，但图片中没有精液分析报告，也没有体检表（身高/体重/血压）",
 w:"通俗讲：怀孕是两个人的事，而男方只需一次检查就能回答「种子质量好不好」这个问题，费用低、无创。它的意义在于：如果精液有异常，两个人的调整策略会完全不同（比如要提前看男科、缩短自我尝试的时间）。而且精子从生成到排出大约需要 74 天，也就是现在这三个多月的作息饮食调整，正好在 3 个月后的精液结果里体现出来。",
 a:["尽快安排：到男科或生殖医学科做精液常规 + 形态学（要求禁欲 2–7 天，多数门诊建议 3–5 天，取精后 1 小时内送检）","做之前 3 个月就开始执行本计划的作息、运动、饮食（因为效果要 74 天才能体现）","补做基础体检：身高、体重、腰围、血压（报告里没有这几项，BMI 是男方的核心待补指标）","如有精索静脉曲张、隐睾史、腮腺炎并发睾丸炎史、化疗史、长期用药史，检查时一定告诉医生"]},

{who:"m",pri:"high",t:"BMI 29.7 属于肥胖（174cm / 90kg）——男方这边的第一优先动作",
 d:"报告依据：本人补充（2026-11-02）身高 174cm、体重 90kg → BMI = 90 ÷ 1.74² = 29.7（中国标准：24.0–27.9 超重，≥28 肥胖）；婚检化验本身正常（ALT 17.5、空腹血糖 4.63、肌酐 83.6）",
 w:"通俗讲：男方肥胖影响精子是有明确机制的，不是「身体好就行」这种安慰话。脂肪组织里有一种叫芳香化酶的东西，会把睾酮转成雌激素，脂肪越多这个转化越强，结果就是总睾酮下降、雌激素相对升高，进而影响精子浓度、活力和 DNA 碎片率；肥胖还和勃起功能下降、自然受孕所需时间变长有关。她的 BMI 是 27.34，你们是两个人同时偏高——这意味着「减重」在这份计划里是双人主线，而不是女方一个人的作业。另外一个现实好处：两个人一起减，执行率比一个人高得多，而且怀孕后女方饮食受限、更难管理体重，现在把家里的饮食环境改掉最划算。",
 a:["第一阶段目标（3 个月）：减掉当前体重的 5%–10%，也就是 90kg → 85.5kg（−5%）到 81kg（−10%），速度每周 0.5–1kg，不要更快","长期目标：BMI 降到 25 以下（约 76kg），最理想 24 以下（约 73kg）——但不必一步到位，先把 3 个月的 4.5–9kg 完成","做法：每周 150 分钟中等强度有氧起步，2 个月内升到 300 分钟（快走/慢跑/骑行/游泳/跳绳）+ 每周 2 次力量训练；力量训练能提高静代代谢，男方减重期特别值得做","饮食按「日常动作规则」那页执行，和女方同一套；男方不需要吃叶酸以外的补剂，重点是热量结构和酒精","极端节食和高速减重要避免：短期内热量骤降、过度训练初期反而可能让精子指标暂时变差，稳步下降才是正解","每周一同一时间、同一秤称重，记在本页的体重表里（选「男方」），看趋势","顺便自查：如果打呼噜明显、夜里憋醒、白天嗜睡，BMI 29.7 的人群睡眠呼吸暂停并不少见——它会同时恶化胰岛素抵抗、睡眠和激素，值得告诉医生"]},

{who:"m",pri:"mid",t:"慢性鼻炎 + 咽炎：要管的是「睡眠质量」和「用药成分」两件事",
 d:"报告依据：本人补充（2026-11-02）有鼻炎、咽炎，自觉「火气比较大」；婚检项目中未见耳鼻喉科检查记录",
 w:"通俗讲：慢性鼻炎对备孕的间接影响主要来自夜里鼻塞——张口呼吸、睡眠变浅、深睡减少，而睡眠不足正是这次计划要改的核心项之一（它影响睾酮、精子生成和激素节律）。慢性咽炎则多数是「被刺激出来的」：鼻涕往后流（鼻后滴漏）、辛辣和过烫饮食、用嗓、二手烟、胃酸反流，其中鼻后滴漏是最常见也最容易被忽略的原因，所以把鼻炎控制稳定，咽炎常常跟着一起好。",
 a:["每天用生理性海盐水或温盐水洗鼻 1–2 次（药店有卖洗鼻器和盐包）：不含药、不影响生育，对鼻炎和鼻后滴漏引起的咽炎都直接有效，是这一条里性价比最高的动作","卧室湿度维持 40%–60%，避免空调/暖气直吹；尘螨是常见过敏原——床单被套枕套每 1–2 周 60℃以上热水洗、枕芯定期晒或更换","忌过烫、过辣、过硬食物和酒；戒掉「热汤烫嘴」的习惯（长期高温刺激咽喉和食管黏膜）","有反酸、烧心、夜里嗓子发黏，考虑胃食管反流引起的慢性咽炎，晚餐后 3 小时内别躺下，必要时告诉医生","不要自己在网上判断是过敏还是感冒：做一次耳鼻喉科检查，明确是过敏性鼻炎还是血管运动性鼻炎。鼻用糖皮质激素（如布地奈德鼻喷）在备孕和孕期的安全数据相对充分，但需医生开具和规定用法；口服减充血剂（含伪麻黄碱、麻黄素的鼻塞药）不建议常用，务必让医生确认","出现发热、咽痛剧烈或单侧痛、扁桃体化脓、颈部淋巴结肿大——不是「上火」，需要就诊，不要靠清火药压下去"]},

{who:"p",pri:"high",t:"「上火了就自己买药吃」——备孕期最需要核查的一类成分",
 d:"报告依据：男方陈述「火气比较大」+ 鼻炎咽炎（最常见的自行购药场景）；双方报告中均未记录用药史（图片中未见该栏）",
 w:"通俗讲：上火、口腔溃疡、嗓子痛，大家默认动作是去药店买清火药或含片，而备孕期真正要小心的恰恰是这些「不算药的东西」。具体说：牛黄解毒片/丸里含雄黄（硫化砷），长期或加量服用会带来砷暴露，备孕和孕期都应避免；部分中成药含朱砂（硫化汞）、活血通经或泻下成分，同样不适合；很多含片、喷剂是复方不明成分，孕期没有安全数据；治鼻塞的口服减充血剂会收缩血管，备孕期也建议少用。另外男方这一类里还包括治脱发的非那雄胺和含激素的增肌补剂——它们会抑制精子生成，需要主动告诉医生。「上火」本身绝大多数和熬夜、缺水、维生素 B 族和锌摄入不足、口腔卫生产生直接相关，改这些比吃清火药有效。",
 a:["做一次家庭药箱盘点：把所有在吃/在用的处方药、非处方药、中成药、含片、喷剂、保健品逐条列清单（或直接拍照），带去门诊让医生或药师过一遍","重点核查这几个关键词：雄黄、朱砂、马兜铃、麝香/冰片类活血开窍成分、大黄的长期服用；看到「牛黄解毒」这类名字就先问","把上火的处理方式换成：多喝水（目标每天 1500–2000ml）、淡盐水漱口、23:00 前睡觉、把蔬果和瘦肉/蛋/奶吃够（B 族和锌的来源）、口腔溃疡用局部用药并让药师确认——不要靠苦寒清火药长期压","任何一方在吃口服维 A 酸类（异维 A 酸等治痘药）必须立刻说明，并按医嘱停药留出间隔后再怀孕","咽痛伴发热、化脓、明显单侧疼痛、颈部包块请就诊，别当上火自己吃药"]},

{who:"m",pri:"mid",t:"久坐 + 熬夜 + 外卖：男方这三项对精子是三重打击",
 d:"报告依据：男方本人陈述的日常状态（久坐基本不运动、熬夜睡眠不足、外卖为主饮食不规律）；男方化验本身全部正常",
 w:"通俗讲：男方化验单干净不代表可以不动——精液质量是查不出来的部分（活力、形态、DNA 碎片率）受生活方式影响最大。久坐+高温让睾丸温度升高，熬夜打乱激素节律，外卖的高油高糖会推高体重和氧化应激。三项同时改善，是最经济的「精子优化方案」。",
 a:["每坐 50 分钟必须起来活动 3–5 分钟（设闹钟；接水、走两层楼梯都算）","避免高温：不泡温泉、不蒸桑拿、不把笔记本放大腿上、不久坐皮椅、不穿紧身不透气的裤子、热水洗澡水温别太高","23:00 前上床，7–8 小时睡眠；这条和女方的作息要一起执行，一个人做不到","每周 150 分钟中等强度有氧（快走/慢跑/骑行/游泳）+ 每周 2 次力量训练","体重现在已知是 BMI 29.7（174cm/90kg）：减重是男方第一优先动作，3 个月目标 85.5kg（−5%）到 81kg（−10%），详见上一条"]},

{who:"m",pri:"mid",t:"男方需要主动告知医生的用药和补剂（容易被忽略）",
 d:"报告依据：男方报告里没有用药史记录栏（图片中未见），需本人自查",
 w:"通俗讲：几类常见东西会实实在在影响精子生成或早期胚胎，而很多人不知道要主动告诉医生。最典型的是治脱发的非那雄胺、外源性雄激素/类固醇类增肌补剂、部分胃药和情绪类药物、大剂量激素类药膏。另外女性不该碰的口服维 A 酸（异维 A 酸治痘）在男方身上的限制比女方小，但也建议说明。",
 a:["把正在吃的一切列成清单（处方药、非处方药、蛋白粉/增肌粉/氮泵、中成药、保健品），带去门诊给医生过一遍","如在使用非那雄胺（治脱发）或任何含雄激素的补剂：现在就去问医生备孕期间要不要停、停多久（不要自己猜）","任何一方在吃口服维 A 酸类（异维 A 酸等治痘药物）必须立刻说明并按医嘱停药并留出间隔","戒烟戒酒包括二手烟；咖啡因每天控制在 200mg 以内（约 1 杯中杯美式）"]},

/* ---- 双方共同 ---- */
{who:"p",pri:"high",t:"叶酸：今天就开始吃（这是唯一一件今天就能做完的关键动作）",
 d:"报告依据：女方叶酸 25.19 nmol/L 正常、叶酸代谢基因 MTHFR C677T C/T 杂合（低风险）；婚检生育建议原文——「女方在怀孕前 3 个月即可科学增补叶酸、钙、铁等营养素及微量元素」",
 w:"通俗讲：叶酸预防的是胎儿神经管畸形（无脑儿、脊柱裂），而神经管在受孕后 3–4 周就闭合，那时候很多人还没发现自己怀孕。所以必须提前补，等验孕棒两条杠再吃就来不及了。标准剂量是每天 0.4mg（400μg），也有指南建议 0.4–0.8mg。药店最常见的 0.4mg 规格、一天一片就对了。注意：5mg 规格的叶酸片是治贫血用的，不要吃错。",
 a:["女方：今天开始每天 0.4mg 叶酸片（或含 0.4mg 叶酸的孕妇复合维生素），固定早餐后服用，至少吃到孕满 3 个月；漏服第二天照常一片，不要加倍","因为有超重 + 胰岛素抵抗，门诊时直接问医生：我该吃 0.4 还是 0.8mg？加大剂量只能由医生决定","男方：也可按 0.4mg 补充（对精子有利，安全性好），但不是硬性要求","已经在吃复合维生素的话，核对标签上叶酸含量，避免叠加超过每日 1mg（1000μg）的常规上限"]},

{who:"p",pri:"high",t:"时间安排：32 岁不需要焦虑，但有 PCOS 就不能无限期自己试",
 d:"报告依据：女方 1994-06 出生（32 岁）；诊断 PCOS + 胰岛素抵抗 + 高泌乳素待明确；婚检医学意见「未发现医学上不宜结婚的情形，生育建议：可以正常备孕」",
 w:"通俗讲：医学上一般认为女方 35 岁以下、规律性生活满 12 个月未孕才需要做不孕系统评估。但她的情况有已知诊断（PCOS、排卵可能不规律），所以策略应该是：先花 3 个月把身体调整到位，同时把该查的查清楚，然后进入正式试孕；如果试孕 6 个月没成功，就尽早去生殖医学中心，不要再拖到 12 个月。这个节奏既不浪费钱，也不耽误时间。",
 a:["第 1–3 个月（2026 年 11 月–2027 年 1 月）：调整期。减重、控糖、复查异常指标、男方精液分析、门诊把用药方案定下来——这个阶段的目标不是怀孕，是把身体调到容易怀孕的状态","第 4 个月起（2027 年 2 月前后）：正式试孕期。规律同房 + 排卵监测","试孕满 6 个月未成功，或连续 3 个月监测不到排卵迹象：挂生殖医学中心，做系统评估","一旦确认怀孕：立即告诉医生 PCOS 和胰岛素抵抗病史，早孕期按医嘱查血糖/甲功，尽早建卡做孕期保健"]},

{who:"p",pri:"mid",t:"同房与排卵：最容易做错的三件事",
 d:"报告依据：本周期信息尚未录入（需要在「周期与排卵」页开始记录）",
 w:"通俗讲：易孕窗口是排卵前 5 天到排卵当天（精子在女性生殖道能活 3–5 天，卵子只有 12–24 小时）。所以「等排卵日再同房」是错的，「天天同房」也会让精液变稀。同时，把每次同房当成任务会伤害两个人——这一点在有备孕压力的夫妻里非常常见。",
 a:["最简单有效的做法：全周期每 2–3 天一次，不刻意算日子；或用排卵试纸（LH）从周期第 10 天开始测，出现强阳当天起每 1–2 天一次，持续到强阳后第 2 天","不需要事后仰卧、垫腿、抬腿——这些没有证据支持，也不会增加怀孕概率","不要用普通人体润滑剂或唾液（多数对精子有抑制作用）；确需时使用「备孕友好」标注的产品；不要做阴道冲洗","禁欲时间不要超过 7 天，太久反而降低活力","PCOS 的特点就是试纸容易「测不准」（基础 LH 偏高或一直不转强阳）：连续 2–3 个周期监测不到明确排卵迹象，就去找医生而不是继续猜"]},

{who:"p",pri:"mid",t:"外卖为主怎么吃：给一套能执行的具体规则",
 d:"报告依据：双方陈述「外卖为主、饮食不规律」；女方 OGTT 2h 9.53↑、胰岛素抵抗、BMI 27.34、脂肪肝",
 w:"通俗讲：控糖和减重最容易失败在「天天点外卖」上。但外卖本身不是问题，点法才是问题。下面这套规则不需要做饭也能执行，重点是每餐的结构和进食顺序——对餐后血糖的影响立竿见影。",
 a:["每餐结构（按拳头量）：1 拳主食（优先杂粮饭/玉米/红薯/南瓜，白米饭减半）+ 1.5–2 拳蛋白质（鸡胸/鱼虾/牛肉/蛋/豆腐）+ 2 拳蔬菜（深色为主）","进食顺序：先吃蔬菜和蛋白质，最后吃主食；餐后别立刻坐下，散步 15–20 分钟（这条对降餐后血糖非常有效）","点单避坑：不点糖醋/红烧/干锅/勾浓芡的；汤和酱汁不喝完；油炸每周不超过 1 次；麻辣烫/冒菜选清汤、麻酱减半、多加绿叶菜和豆制品；外卖太油可以过一下热水","含糖饮料和奶茶：这是本计划第一优先级要清零的一项（含糖饮料直接推高血糖、胰岛素和肝脏脂肪）。目标：完全不喝，或每周最多 1 次且不含糖","夜宵和进食时间：晚餐七分饱、睡前 3 小时不再进食（把进食窗口收紧，对胰岛素抵抗和减重都有效）","奶制品每天 300ml（补钙和维生素 D）；红肉每周 2–3 次（补铁，但在铁蛋白结果出来前不要自行吃铁剂）；每周 1–2 次海产品 + 碘盐保证碘摄入","咖啡因女方每天不超过 200mg（约 1 杯中杯美式），包括奶茶里的茶底"]},

{who:"p",pri:"mid",t:"睡眠和作息：把它当成处方，不是建议",
 d:"报告依据：双方陈述「熬夜、睡眠不足」；女方泌乳素两次升高、PCOS、糖耐量受损；男方精液质量待查",
 w:"通俗讲：熬夜对备孕的伤害是有具体路径的——睡不够会升高泌乳素和皮质醇、加重胰岛素抵抗、扰乱排卵节律；对男方则直接压低睾酮、损伤精子 DNA。所以「23:00 前睡觉」在这份计划里的地位，和吃叶酸、复查指标是一回事。",
 a:["固定 23:00 上床、6:30–7:00 起床（周末波动不超过 1 小时），目标 7–8 小时","睡前 1 小时手机放到房间外或开勿扰，屏幕亮度调低","卧室保持凉、暗、安静；午睡控制在 20–30 分钟以内，下午 2 点后不喝茶咖啡","两个人一起做才有效——任何一方独自早睡通常坚持不下去","记录在打卡页里，2 周后回看：熬夜次数下降往往伴随体重下降和精力上升"]},

{who:"p",pri:"mid",t:"环境、疫苗与其他准备",
 d:"报告依据：女方 HPV 全阴、风疹已免疫；TORCH 弓形虫易感；报告中未见口腔、乳腺、水痘抗体、糖化血红蛋白、铁蛋白等项目",
 w:"通俗讲：还有一些备孕准备容易被忽略，但它们各自有明确的处理方式和时间要求。孕期看牙、用药都受限，所以牙齿问题要孕前解决；怀孕后不打活疫苗，所以疫苗安排要在孕前完成。",
 a:["口腔：双方做一次检查 + 洗牙；女方重点处理牙周炎、龋齿、智齿（孕期牙病治疗选择很少）","乳腺：做一次乳腺超声（报告里未见，作为孕前基线）；如有结节按医生建议复查","水痘抗体：报告里没有。如果从未出水痘也没接种过，问要不要接种（接种后需按医嘱间隔一段时间再怀孕）；已免疫就跳过","HPV 疫苗：她检测全阴，可以咨询接种安排，但孕期不接种，注意和时间表的衔接；打完不等于不用做宫颈癌筛查","流感疫苗：备孕期和孕期都可以接种灭活流感疫苗，流行季建议打，具体问医生","居住/工作环境：新装修房（甲醛）、农药/杀虫剂、有机溶剂、油漆、重金属、放射线职业暴露——逐项排查并调整","家中停用不明成分香薰精油、灭蚊片长期密闭使用；厨房开抽油烟机","双方各自的体检缺项：血压、身高体重腰围（男方完全没有这些数据）","证件与政策：了解本地免费孕前优生健康检查项目（很多社区妇幼保健机构提供，含部分筛查项目），能省一部分复查费用"]},

{who:"p",pri:"low",t:"情绪与两人关系：备孕最容易坏掉的东西",
 d:"报告依据：双方 31/32 岁、工作压力未知；女方已有多项待处理指标（容易产生「是我身体不好」的自责）",
 w:"通俗讲：这份计划里女方要改的东西比较多（体重、血糖、复查、可能促排），非常容易出现两种坏结果：女方觉得被指责、男方觉得自己只是「陪着」。压力本身会加重排卵障碍，所以「让两个人都承担自己的部分」是有医学意义的，不只是情感问题。",
 a:["明确分工：男方负责猫砂、复查陪同、记录、饮食环境（这两项是他的实际贡献，不是帮忙）","把打卡页放在两个人都能看到的地方，用「今天我们一起做了几件」代替「你今天做没做」","体重和化验数字只看趋势，某一天不好看不代表失败","试孕 2–3 个月没成功是正常概率事件，不代表身体有问题","如果连续几个周期出现明显焦虑、失眠或情绪低落，寻求专业心理支持是可选项，不是软弱"]},

{who:"p",pri:"high",t:"出现这些情况不要等，尽快就诊",
 d:"婚检结论汇总（2026-07-24）+ 各化验异常项",
 w:"通俗讲：以下任何一条出现，都说明应该把自我调整升级为医生介入。",
 a:["连续 3 个周期监测不到排卵迹象；或月经周期超过 45 天、甚至闭经 3 个月","规律试孕满 6 个月未孕（因为有 PCOS + 胰岛素抵抗，不必等到 12 个月）","泌乳素持续升高，或出现头痛、视野变窄、非哺乳期溢乳","出现血糖偏高症状（明显口渴多尿、体重快速变化），或指血/化验提示达到糖尿病范围","转氨酶再次升高，或出现乏力、食欲差、皮肤发黄","肌无力、肌肉酸痛明显、尿色呈酱油色或浓茶色","发现怀孕后出现腹痛、阴道出血——立即就诊（PCOS 人群早孕期需更早确认妊娠位置和激素水平）","孕期任何用药（包括感冒药、外用药、中成药、保健品）先咨询医生或药师"]}
]

 {id:"p0-14",t:"男方开始每天生理盐水洗鼻 1–2 次（鼻炎 + 咽炎，同时改善夜间呼吸和睡眠）",tag:"睡眠"}

{name:"第 1 阶段 · 第 1–4 周（2026-11 ~ 12 上旬）调整打地基",sub:"目标：饮食结构切换 + 补齐关键检查",
 items:[
 {id:"p1-1",t:"饮食切换到「1 拳主食 + 1.5–2 拳蛋白 + 2 拳蔬菜」，先吃菜和蛋白",tag:"饮食"},
 {id:"p1-2",t:"运动从每周 3 次 × 30 分钟快走起步（能说话但唱不了歌的强度）",tag:"运动"},
 {id:"p1-3",t:"餐后散步 15–20 分钟（女方优先，直接改善餐后血糖）",tag:"运动"},
 {id:"p1-4",t:"复查：泌乳素（规范条件上午抽血）+ 巨泌乳素",tag:"检查"},
 {id:"p1-5",t:"补查：糖化血红蛋白 HbA1c",tag:"检查"},

 {id:"p1-8",t:"补查：维生素 B12（长期服二甲双胍）",tag:"检查"},
 {id:"p1-9",t:"完成精液常规 + 形态学，拿到结果给医生",tag:"检查"},
 {id:"p1-10",t:"女方开始用排卵试纸或观察宫颈黏液，记录在本页",tag:"记录"},

 {id:"p1-12",t:"做一次乳腺超声；查水痘抗体（如从未感染/接种）",tag:"检查"},
 {id:"p1-13",t:"女方开始每天补充维生素 D3 1000–2000 IU（按医嘱）",tag:"补充剂"},
 {id:"p1-14",t:"体重每周同一时间记录 1 次，只看趋势",tag:"记录"},
 {id:"p1-15",t:"男方补查：血脂四项 + 尿酸 + 肝脏超声（尽量和精液分析同一趟抽血）",tag:"检查"},
 {id:"p1-16",t:"男方体重开始下降：每周 0.5–1kg，本月累计 −2~−4kg（起点 90kg）",tag:"饮食"}

{name:"第 2 阶段 · 第 5–12 周（2026-12 ~ 2027-01）核心改造",sub:"目标：减重 5%–10% + 让排卵有证据",
 items:[
 {id:"p2-1",t:"体重累计下降达到原体重的 5%（速度每周 0.5–1kg，不要更快）",tag:"饮食"},
 {id:"p2-2",t:"运动提升到每周 5 次 × 30 分钟 + 每周 2 次力量训练",tag:"运动"},
 {id:"p2-3",t:"睡眠达标率 ≥80%（23:00 前入睡）",tag:"睡眠"},
 {id:"p2-4",t:"3 个月后复查：25-OH 维生素 D（目标 >30 ng/mL）、糖化血红蛋白、肝功",tag:"检查"},
 {id:"p2-5",t:"门诊复盘：泌乳素复查结果 + 是否需要药物或垂体 MRI（医生判断）",tag:"门诊"},
 {id:"p2-6",t:"与医生讨论：是否需要促排卵（来曲唑等）以及何时开始",tag:"门诊"},
 {id:"p2-7",t:"男方完成非那雄胺/类固醇类补剂的停用确认（如在用，问医生）",tag:"门诊"},
 {id:"p2-8",t:"如女方是地贫携带：男方补做血红蛋白电泳 + 地贫筛查",tag:"检查"},
 {id:"p2-9",t:"把两个人的化验结果录入「复查清单」页，形成基线对照",tag:"记录"},
 {id:"p2-10",t:"整理一页「我的情况摘要」给以后每次产检看：PCOS + 胰岛素抵抗 + 甲功正常 + 风疹已免疫",tag:"记录"},
 {id:"p2-11",t:"男方体重达标：达到 −5%（85.5kg）以上，并继续向 −10%（81kg）推进；腰围同步下降",tag:"饮食"},
 {id:"p2-12",t:"男方运动量提升到每周 300 分钟中等强度 + 每周 2 次力量训练",tag:"运动"},
 {id:"p2-13",t:"耳鼻喉科门诊：确定鼻炎类型和用药方案（把在吃的清火药、含片一起给医生看）",tag:"门诊"}
]},
{name:"第 3 阶段 · 第 13 周起（约 2027-02）正式试孕",sub:"目标：规律同房 + 抓排卵窗口",
 items:[
 {id:"p3-1",t:"全周期每 2–3 天同房一次，不刻意等排卵日",tag:"同房"},
 {id:"p3-2",t:"排卵试纸从周期第 10 天开始测，强阳当天起每 1–2 天一次",tag:"同房"},
 {id:"p3-3",t:"不使用普通润滑剂，不做阴道冲洗",tag:"同房"},
 {id:"p3-4",t:"停经后尽早用验孕棒；确认怀孕立即建卡并告知 PCOS/胰岛素抵抗史",tag:"门诊"},
 {id:"p3-5",t:"如试孕满 6 个月未孕，或连续 3 周期无排卵迹象：挂生殖医学中心系统评估",tag:"门诊"},
 {id:"p3-6",t:"保持体重稳定，怀孕前不停叶酸；孕早期不要擅自停所有药物（找医生确认）",tag:"补充剂"}
]}
]

function aiViaProxy(payload){
  return fetch(AI.proxy,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){
    return r.text().then(function(txt){
      var j;
      try{j=JSON.parse(txt);}catch(e){throw new Error("代理返回格式不对："+txt.slice(0,160));}
      if(!r.ok||j.error)throw new Error(j.error||("代理返回 "+r.status));
      if(j.analysis)return j.analysis;
      if(j.choices)return parseModelJson(extractModelText(j));

    });

function aiDirect(payload){

function personItems(side){return side==="f"?DAILY.f:DAILY.m;}
function dayRec(d){return S.check[d]||{};}
function lastWeight(side){
  var ws=(S.weights||[]).filter(function(w){return w.s===side;}).sort(function(a,b){return a.d<b.d?-1:1;});
  return ws.length?ws[ws.length-1]:null;
}
function countFor(side,d){var r=dayRec(d);return personItems(side).filter(function(x){return r[x.k];}).length;}
function sharedDone(d){var r=dayRec(d);return SHARED.filter(function(x){return r[x.k];}).length;}
function totalDone(d){return countFor("f",d)+countFor("m",d)+sharedDone(d);}
function isPass(d){return totalDone(d)>=PASS;}
function dayIdx(d){var a=d.split("-").map(Number);return (new Date(a[0],a[1]-1,a[2]).getDay()+6)%7;}
function weekIdx(d){return Math.floor(dayDiff(START,d)/7);}
function rotWeek(d){var w=weekIdx(d);if(w<0)w=0;return w%4;}
function dinnerFor(d){return DINNERS[rotWeek(d)*7+dayIdx(d)];}
function breakfastFor(d){return BREAKFASTS[dayIdx(d)%BREAKFASTS.length];}
function lunchFor(d){return LUNCHES[dayIdx(d)%LUNCHES.length];}
function streak(){
  var n=0,d=today();
  while(n<365&&isPass(d)){n++;d=shiftDay(d,-1);}
  return n;
}
function daysLogged(){
  var n=0;for(var k in S.check){if(Object.keys(S.check[k]).length)n++;}

}

/* ============ 周期页 ============ */
function renderCycle(){
  var h='<div class="pagehead" style="padding-left:16px;padding-right:16px"><h1>周期与排卵</h1><p>多囊的核心问题是「这个月到底排没排卵」。记 2–3 个周期，医生一眼就能判断。</p></div>';
  h+='<div class="wrap" style="padding-top:4px">';
  var ps=(S.periods||[]).slice().sort();
  if(ps.length){
    var gaps=[];for(var i=1;i<ps.length;i++)gaps.push(dayDiff(ps[i-1],ps[i]));
    var avg=gaps.length?Math.round(gaps.reduce(function(a,b){return a+b;},0)/gaps.length):0;
    var cyc=(avg>=21&&avg<=60)?avg:(avg||28);
    var last=ps[ps.length-1],nextP=shiftDay(last,cyc),nextOv=shiftDay(nextP,-14),winS=shiftDay(nextOv,-5);
    h+='<div class="card pad"><div class="grid2">'+
      '<div class="stat"><div class="n">'+esc(last)+'</div><div class="l">最近一次月经第一天</div></div>'+

      '<div class="stat"><div class="n">'+esc(nextOv)+'</div><div class="l">预计排卵日</div></div>'+
      '<div class="stat"><div class="n" style="font-size:13.5px;line-height:1.5">'+esc(winS)+' ~ '+esc(shiftDay(nextOv,1))+'</div><div class="l">预计易孕窗口</div></div>'+
    '</div><p class="rowh" style="margin-top:10px">多囊会让排卵日明显漂移，这个推算只作参考。确认排卵看：试纸由强转弱、蛋清样粘液、体温升高 0.3–0.5℃ 并维持 11 天以上，或 B 超监测。</p></div>';
  }else{
    h+='<div class="card pad"><div class="evid"><b>还没有记录。</b>先把最近一次月经「第一天」填到下面——那一天算周期第 1 天，不是出血结束那天。</div></div>';

  // explainer

  var folds=[
    ["有月经 ≠ 有排卵","月经是子宫内膜脱落出血。它可能是排了卵、没怀孕后的正常月经，也可能是这个月根本没排卵、激素波动引起的「撤退性出血」——看着像月经，里面却没有卵子。多囊的人常常血照来、周期看着也不算离谱，但排卵很少甚至没有。所以别「算日子」，要「监测」。"],
    ["试纸在测什么","测的是尿里的 LH（黄体生成素）。排卵前 24–36 小时 LH 会猛冲一下，叫「LH 峰」；试纸强阳 = 峰到了，通常 24–48 小时内排卵。它测的是「排卵指令」，不是卵子本身。从月经第 10 天开始，每天固定 10:00–20:00 测，不用晨尿，测前 2 小时少喝水。"],
    ["粘液和体温怎么配合","接近排卵时宫颈粘液变多、变清、像生蛋清，能拉丝 5–10cm，这是身体给的易孕信号。排卵后孕激素让体温升高 0.3–0.5℃ 并维持 11 天以上，用来事后确认「真的排了」。两个信号一个看环境、一个看结果，配上试纸才完整。"]
  ];
  folds.forEach(function(f,i){

  h+='<div class="card pad"><div class="evid" style="background:#fdf7ef;border-color:#f2e3cc"><b>多囊的坑：</b>LH 基线本来就偏高，试纸可能长期浅阳、或反复强阳却不排卵。连着两个周期都「说不清」，别跟试纸较劲，直接去医院做 B 超卵泡监测。</div></div>';

  // add record
  h+='<div class="sechead"><h2>记一笔</h2><span>月经 / 试纸 / 同房 / 体温</span></div>';
  h+='<div class="card form">'+
    '<label>日期<input type="date" id="cdate" value="'+state.date+'"></label>'+
    '<label>类型<select id="ctype"><option value="p">月经第一天</option><option value="pe">月经结束</option><option value="lh">排卵试纸结果</option><option value="s">同房</option><option value="bbt">基础体温</option></select></label>'+

  (S.pe||[]).forEach(function(d,i){rows.push({d:d,t:"月经结束",v:"—",k:"pe",i:i});});
  (S.lh||[]).forEach(function(r,i){rows.push({d:r.d,t:"排卵试纸",v:r.v,k:"lh",i:i});});

  h+='<div class="card">';
  if(rows.length){
    rows.forEach(function(r){
      h+='<div class="record"><span class="rd">'+shortD(r.d)+' '+weekdayOf(r.d).replace("周","")+'</span><span class="rt">'+r.t+'</span><span class="rv">'+esc(r.v)+'</span><button class="del" data-delc="'+r.k+'|'+r.i+'">删</button></div>';

  }

  h+='<div class="card pad"><div class="evid" style="background:#fdf1ef;border-color:#f3d6d0"><b>这些情况别自己猜，去妇科内分泌/生殖科：</b>周期超过 45 天或闭经 3 个月；连续 3 个周期监测不到排卵；试孕满 6 个月没成功；非哺乳期溢乳、头痛或视野变窄。</div></div>';
  h+='</div>';
  return h;
}

/* ============ 三餐拍照分析 ============ */
function renderMeals(){
  var d=state.date, side=state.side, canEdit=side===state.role;
  var h='<div class="subhead"><button data-back="1" aria-label="返回">‹</button><h2>饮食拍照记录</h2><button class="swap" data-sub="ai" style="margin-left:auto">AI 设置</button></div>';
  h+='<div class="wrap" style="padding-top:2px">';
  h+='<div class="mtabs"><button data-side="f" class="'+(side==="f"?"on":"")+'">她</button><button data-side="m" class="'+(side==="m"?"on":"")+'">他</button></div>';
  h+='<div class="card pad" style="display:flex;align-items:center;gap:10px;padding:11px 13px">'+
    '<button class="harrow" data-shift="-1" aria-label="前一天" style="background:#f4f8f6;color:var(--g)">‹</button>'+
    '<div style="flex:1;text-align:center;min-width:0"><div style="font-size:14px;font-weight:650">'+md(d)+' '+weekdayOf(d)+'</div><div class="rowh">'+(d===today()?"今天":"回看模式")+'</div></div>'+
    '<button class="harrow" data-shift="1" aria-label="后一天" style="background:#f4f8f6;color:var(--g)"'+(d===today()?" disabled":"")+'>›</button>'+
  '</div>';
  if(d!==today())h+='<div style="text-align:center;margin:-4px 0 12px"><button class="btn2" data-today="1" style="flex:none;min-width:110px">回到今天</button></div>';
  h+='<div class="card pad"><div class="aiwarn"><b>怎么拍：</b>拍自己这一盘，不要拍整桌；把筷子或手掌放进去当参照。AI 只能估算，热量误差通常 20%–30%，微量元素误差更大。补剂不算在食物里。</div>'+
    '<div class="mplan" style="margin-top:8px">三餐都记录后，回打卡页勾「三餐都拍照记录」；只记一两餐也可以，汇总按已记录的算。</div>'+
    '<div class="mact">'+(canEdit?'<button class="pri" data-meal-demo="1">用示例数据看效果</button>':'<span class="ropill">只读：只能看对方记录</span>')+'<button data-sub="ai">配置 AI</button></div></div>';
  h+=renderMealSummary(d,side);
  MEAL_KEYS.forEach(function(m){h+=renderMealCard(d,side,m);});
  h+=renderMealTrend(side);
  h+='<p class="foot">三餐拍照已并入每日打卡：她、他各 1 项「三餐都拍照记录」，三餐都记录后回打卡页勾选。分析数值只作趋势，补剂另算。<br>照片只存在这台设备；AI 分析时会把照片发给所配置的服务商。</p>';
  h+='</div>';
  return h;
}
function renderMealSummary(d,side){
  var sum=sumMeals(d,side), t=MEAL_TARGETS[side];
  var h='<div class="sechead"><h2>今天吃了多少</h2><span>已分析 '+sum.n+'/3 餐</span></div>';
  h+='<div class="card msum">';
  if(!sum.n){
    h+='<div class="mtitle">还没有分析记录</div><p class="mplan">先拍早餐，或者点上面的「用示例数据看效果」。未分析的餐不计入汇总。</p>';
    h+='<div class="mdots">'+MEAL_KEYS.map(function(m){return '<span>'+MEAL_LABELS[m]+'</span>';}).join("")+'</div>';
    h+='</div>';
    return h;
  }
  h+='<div class="big"><b>'+fmtNum(sum.kcal,0)+'</b><span>kcal · 目标 '+t.kcal[0]+'–'+t.kcal[1]+'</span></div>';
  h+='<div class="mdots">'+MEAL_KEYS.map(function(m){var r=mealRec(d,side,m);return '<span class="'+(r?"on":"")+'">'+MEAL_LABELS[m]+(r?' ✓':'')+'</span>';}).join("")+'</div>';
  var mid=(t.kcal[0]+t.kcal[1])/2, cp=Math.min(100,sum.kcal/mid*100), ccls=sum.kcal>t.kcal[1]?"hi":(sum.kcal<t.kcal[0]*0.75?"lo":"");
  h+='<div class="mbar" style="margin-top:10px"><div class="lab"><span>热量</span><b>'+fmtNum(sum.kcal,0)+' / '+t.kcal[0]+'–'+t.kcal[1]+' kcal</b></div><div class="tr"><i class="'+ccls+'" style="width:'+cp+'%"></i></div></div>';
  h+='<div class="mgrid">';
  MEAL_NUTRIENTS.forEach(function(n){
    var val=num(sum[n.k]), target;
    if(n.k==="protein"){target=t.protein[0];}else{target=t[n.k]||0;}
    var pct=target?Math.min(100,val/target*100):0;
    var cls=val>target*1.25?"hi":(val<target*0.6?"lo":"");
    var tlabel=n.k==="protein"?(t.protein[0]+"–"+t.protein[1]+n.u):(target+n.u);
    h+='<div class="mbar"><div class="lab"><span>'+n.n+'</span><b>'+fmtNum(val,n.d)+' / '+tlabel+'</b></div><div class="tr"><i class="'+cls+'" style="width:'+pct+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<p class="mconf">食物估算，不含补剂。蛋白质目标 '+(side==="f"?"90–100":"100–120")+'g；叶酸、锌、硒、维生素 D 只作趋势看，不用追求每餐达标。</p>';
  h+='</div>';
  return h;
}
function renderMealCard(d,side,meal){
  var rec=mealRec(d,side,meal), k=photoKey(d,side,meal), ph=PHOTO_CACHE[k]||"";
  var canEdit=side===state.role, plan=plannedMeal(d,meal)||{n:""};
  var h='<div class="card mealcard"><div class="mtop">';
  h+='<div class="mthumb" data-photo="'+k+'">'+(ph?'<img src="'+ph+'" alt="这一餐的照片">':'<div class="mph">'+IC.camera+'<span>拍照<br>或选图</span></div>')+'</div>';
  h+='<div class="mbody"><div class="mtitle">'+MEAL_LABELS[meal]+(rec?'<span class="tag '+(rec.demo?"demo":rec.manual?"manual":"")+'">'+(rec.demo?"示例":rec.manual?"手动":"已分析")+'</span>':'')+'</div>';
  h+='<div class="mplan">计划：'+esc(plan.n||"")+'</div>';
  h+='<div class="mact">';
  if(canEdit){
    h+='<button data-photo-pick="'+meal+'">'+(ph?"换图":"拍照/选图")+'</button>';
    if(ph||AI_DEMO)h+='<button class="pri" data-meal-ai="'+meal+'">'+(rec?"重新分析":"AI 分析")+'</button>';
    h+='<button data-meal-manual="'+meal+'">手动</button>';
    if(rec)h+='<button class="danger" data-meal-del="'+meal+'">删除</button>';
  }else{
    h+='<span class="ropill">只读</span>';
  }
  h+='</div></div></div>';
  if(AI_BUSY[k]){
    h+='<div class="mres"><div class="mplan">AI 正在看这张图，通常 5–20 秒…</div></div>';
  }else if(rec){
    h+=renderMealResult(rec,meal);
  }
  if(state.manualMeal===meal&&canEdit)h+=renderManualForm(rec);
  h+='</div>';
  return h;
}
function renderMealResult(rec,meal){
  var t=scaleTotals(rec.totals,rec.scale||1);
  var h='<div class="mres">';
  h+='<div class="mkcal"><b>'+fmtNum(t.kcal,0)+'</b><span>kcal · '+(rec.demo?"示例":rec.manual?"手动":"估算")+'</span></div>';
  h+='<div class="mmac"><span>蛋白 '+fmtNum(t.protein,1)+'g</span><span>碳水 '+fmtNum(t.carbs,1)+'g</span><span>脂肪 '+fmtNum(t.fat,1)+'g</span><span>纤维 '+fmtNum(t.fiber,1)+'g</span></div>';
  if(!rec.manual){
    h+='<div class="mmicro">'+
      '<div><span>叶酸</span><b>'+fmtNum(t.folate,0)+' µg</b></div>'+
      '<div><span>锌</span><b>'+fmtNum(t.zinc,1)+' mg</b></div>'+
      '<div><span>硒</span><b>'+fmtNum(t.selenium,0)+' µg</b></div>'+
      '<div><span>维生素 D</span><b>'+fmtNum(t.vitd,0)+' IU</b></div>'+
      '<div><span>钙</span><b>'+fmtNum(t.calcium,0)+' mg</b></div>'+
      '<div><span>铁</span><b>'+fmtNum(t.iron,1)+' mg</b></div>'+
    '</div>';
  }
  if(rec.items&&rec.items.length){
    h+='<div class="mplan" style="margin-top:7px">'+rec.items.slice(0,6).map(function(it){return esc(it.name)+(it.amount?"（"+esc(it.amount)+"）":"");}).join(" · ")+'</div>';
  }
  if(rec.manual&&rec.note)h+='<div class="mplan">备注：'+esc(rec.note)+'</div>';
  if(rec.demo)h+='<div class="mconf">这是示例数据，不是这张照片的真实分析。</div>';
  else if(rec.manual)h+='<div class="mconf">手动记录，只有你填的热量和三大营养素。</div>';
  else h+='<div class="mconf">置信度 '+Math.round((rec.confidence||0)*100)+'%'+(rec.portion_note?' · '+esc(rec.portion_note):'')+'</div>';
  if(rec.comments&&rec.comments.length){
    h+='<ul class="mcmt">'+rec.comments.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  }
  if(!rec.manual){
    h+='<div class="mscale">'+[[0.8,"少了"],[1,"差不多"],[1.2,"多了"]].map(function(x){
      return '<button data-meal-scale="'+x[0]+'|'+meal+'" class="'+((rec.scale||1)===x[0]?"on":"")+'">'+x[1]+'</button>';
    }).join("")+'</div>';
    h+='<div class="mconf">份量不准就点一下，所有数值按 0.8 / 1 / 1.2 倍重算。</div>';
  }
  h+='</div>';
  return h;
}
function renderManualForm(rec){
  var t=rec&&rec.totals?rec.totals:{};
  return '<div class="manualform">'+
    '<label>热量 kcal<input id="mkcal" type="number" inputmode="decimal" value="'+(t.kcal?fmtNum(t.kcal,0):"")+'" placeholder="例如 500"></label>'+
    '<label>蛋白质 g<input id="mprotein" type="number" inputmode="decimal" value="'+(t.protein?fmtNum(t.protein,1):"")+'" placeholder="例如 30"></label>'+
    '<label>碳水 g<input id="mcarbs" type="number" inputmode="decimal" value="'+(t.carbs?fmtNum(t.carbs,1):"")+'" placeholder="可选"></label>'+
    '<label>脂肪 g<input id="mfat" type="number" inputmode="decimal" value="'+(t.fat?fmtNum(t.fat,1):"")+'" placeholder="可选"></label>'+
    '<label class="wide">备注<input id="mnote" value="'+esc(rec&&rec.note?rec.note:"")+'" placeholder="例如：外食，菜过水"></label>'+
    '<div class="row2"><button data-manual-cancel="1">取消</button><button class="pri" data-manual-save="'+esc(state.manualMeal)+'">保存手动记录</button></div>'+
  '</div>';
}
function renderMealTrend(side){
  var max=MEAL_TARGETS[side].kcal[1], days=[], total=0, n=0;
  for(var i=6;i>=0;i--){
    var d=shiftDay(today(),-i), s=sumMeals(d,side);
    days.push({d:d,k:s.kcal,n:s.n});
    if(s.kcal>max)max=s.kcal;
    if(s.n){total+=s.kcal;n++;}
  }

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-side],[data-shift],[data-today],[data-day],[data-ci],[data-hint],[data-wsave],[data-todo],[data-phase],[data-fold],[data-chip],[data-sub],[data-back],[data-ts],[data-addcycle],[data-delc],[data-addtodo],[data-export],[data-import],[data-print],[data-clear],[data-dweek],[data-role],[data-role-switch],[data-unlock],[data-lock],[data-photo-pick],[data-meal-ai],[data-meal-manual],[data-meal-del],[data-meal-scale],[data-meal-demo],[data-manual-save],[data-manual-cancel],[data-ai-save],[data-ai-test],[data-ai-clear],[data-ai-demo-off]");
  if(!el)return;
  var ds=el.dataset;

  if(ds.unlock!==undefined){
    var ac=document.getElementById("acode"),av=ac?(ac.value||"").trim():"";
    if(hashCode("jiankang:"+av)===ACCESS_HASH){
      state.unlocked=true;state.lockErr=false;
      try{localStorage.setItem(UNLOCKKEY,ACCESS_HASH);}catch(e){}
      render();return;
    }
    state.lockErr=true;render();return;
  }
  if(ds.lock!==undefined){
    state.unlocked=false;state.role=null;state.sub=null;state.lockErr=false;
    try{localStorage.removeItem(UNLOCKKEY);}catch(e){}
    render();return;
  }
  if(ds.role!==undefined){
    state.role=ds.role;state.side=ds.role;state.date=today();state.tab="today";state.sub=null;
    LASTROLE=ds.role;try{localStorage.setItem(ROLEKEY,ds.role);}catch(e){}
    render();return;
  }
  if(ds.roleSwitch!==undefined){state.role=null;state.sub=null;render();return;}

  if(ds.tab!==undefined){
    state.tab=ds.tab;state.sub=null;state.manualMeal=null;render();return;
  }
  if(ds.back!==undefined){state.sub=null;state.manualMeal=null;render();return;}
  if(ds.sub!==undefined){state.sub=ds.sub;state.manualMeal=null;render();return;}
  if(ds.side!==undefined){state.side=ds.side;state.manualMeal=null;render(true);return;}
  if(ds.photoPick!==undefined){openPhotoPicker(ds.photoPick);return;}
  if(ds.mealAi!==undefined){analyzeMeal(ds.mealAi);return;}
  if(ds.mealManual!==undefined){state.manualMeal=ds.mealManual;render(true);return;}
  if(ds.manualCancel!==undefined){state.manualMeal=null;render(true);return;}
  if(ds.mealDemo!==undefined){state.sub="meals";fillDemoMeals();return;}
  if(ds.mealDel!==undefined){
    if(state.side!==state.role)return;
    if(!confirm("删除这一餐的记录和照片？"))return;
    var mdKey=ds.mealDel, mdBucket=ensureMeals(state.date,state.side);
    delete mdBucket[mdKey];save();
    var mk=photoKey(state.date,state.side,mdKey);
    delete PHOTO_CACHE[mk];idbDel(mk).catch(function(){});
    state.manualMeal=null;render(true);return;
  }
  if(ds.mealScale!==undefined){
    if(state.side!==state.role)return;
    var sp=ds.mealScale.split("|"), sv=Number(sp[0]), sm=sp[1];
    var sr=mealRec(state.date,state.side,sm);
    if(sr){sr.scale=sv;save();render(true);}
    return;
  }
  if(ds.manualSave!==undefined){
    if(state.side!==state.role)return;
    var mm=ds.manualSave;
    var gi=function(id){var el2=document.getElementById(id);return el2?num(el2.value):0;};
    var mt={kcal:gi("mkcal"),protein:gi("mprotein"),carbs:gi("mcarbs"),fat:gi("mfat")};
    var mn=document.getElementById("mnote");
    if(!mt.kcal&&!mt.protein){alert("至少填热量或蛋白质，才能保存。");return;}
    ensureMeals(state.date,state.side)[mm]={
      at:new Date().toISOString(),items:[],totals:mt,confidence:0,
      portion_note:"手动记录",comments:[],scale:1,demo:false,manual:true,
      note:mn?(mn.value||"").trim():""
    };
    state.manualMeal=null;save();render(true);return;
  }
  if(ds.aiSave!==undefined){
    if(ds.aiSave==="proxy"){
      var ap=document.getElementById("aiProxy");
      AI.proxy=ap?(ap.value||"").trim():"";
      try{localStorage.setItem(AI_PROXY_KEY,AI.proxy);}catch(e){}
      if(AI.proxy)AI_DEMO=false;
      alert("代理地址已保存。");
    }else{
      var ab=document.getElementById("aiBase"), am=document.getElementById("aiModel"), ak=document.getElementById("aiKey");
      AI.base=ab?((ab.value||"").trim()||AI.base):AI.base;
      AI.model=am?((am.value||"").trim()||AI.model):AI.model;
      var akv=ak?(ak.value||"").trim():"";
      if(akv)AI.key=akv;
      try{
        localStorage.setItem(AI_BASE_KEY,AI.base);
        localStorage.setItem(AI_MODEL_KEY,AI.model);
        if(akv)localStorage.setItem(AI_KEY_KEY,AI.key);
      }catch(e){}
      if(AI.key)AI_DEMO=false;
      alert("直连配置已保存。密钥只在这台浏览器里。");
    }
    render(true);return;
  }
  if(ds.aiTest!==undefined){testAIConnection();return;}
  if(ds.aiClear!==undefined){
    if(!confirm("清除这台浏览器里保存的 API Key？"))return;
    AI.key="";
    try{localStorage.removeItem(AI_KEY_KEY);}catch(e){}
    alert("已清除。代理模式不受影响。");render(true);return;
  }
  if(ds.aiDemoOff!==undefined){AI_DEMO=false;render(true);return;}
  if(ds.shift!==undefined){
    var nd=shiftDay(state.date,Number(ds.shift));
    if(nd>today())return;
    state.date=nd;render();return;
  }
  if(ds.today!==undefined){state.date=today();render();return;}
  if(ds.day!==undefined){state.date=ds.day;render();return;}
  if(ds.ci!==undefined){
    if(state.side!==state.role)return;
    if(!S.check[state.date])S.check[state.date]={};
    S.check[state.date][ds.ci]=!S.check[state.date][ds.ci];
    save();render(true);return;
  }
  if(ds.hint!==undefined){
    var rh=document.getElementById("rh-"+ds.hint);
    if(rh){rh.classList.toggle("open");el.classList.toggle("open");
      var hx=el.getAttribute("aria-expanded");
      if(hx!==null)el.setAttribute("aria-expanded",hx==="true"?"false":"true");
    }
    return;
  }
  if(ds.todo!==undefined){
    S.todos[ds.todo]=!S.todos[ds.todo];save();render(true);return;
  }
  if(ds.phase!==undefined){
    var i=Number(ds.phase);
    state.openPhase=(state.openPhase===i)?-1:i;
    render(true);return;
  }
  if(ds.wsave!==undefined){
    if(state.side!==state.role)return;
    var inp=document.getElementById("wkg"),v=inp?num(inp.value):0;
    if(!v||v<30||v>200){alert("请填一个合理的体重（30–200kg）");return;}
    var side=ds.wsave,ex=false;
    (S.weights||[]).forEach(function(w){if(w.s===side&&w.d===state.date){w.kg=v;ex=true;}});
    if(!ex)S.weights.push({s:side,d:state.date,kg:v});
    save();render(true);return;
  }
  if(ds.fold!==undefined){
    var f=document.getElementById("fold-"+ds.fold);
    if(f){f.classList.toggle("open");el.classList.toggle("open");
      var ex=el.getAttribute("aria-expanded");
      if(ex!==null)el.setAttribute("aria-expanded",ex==="true"?"false":"true");
      state.openFolds[ds.fold]=f.classList.contains("open");
    }
    return;
  }
  if(ds.chip!==undefined){state.fWho=ds.chip;render(true);return;}
  if(ds.dweek!==undefined){state.dietWeek=Number(ds.dweek);render(true);return;}
  if(ds.ts!==undefined){
    var parts=ds.ts.split("|"),k=parts[0],st=parts[1];
    S.tests[k]=S.tests[k]||{s:"",r:""};S.tests[k].s=st;save();render(true);return;
  }
  if(ds.addcycle!==undefined){
    var cd=document.getElementById("cdate"),ct=document.getElementById("ctype"),cv=document.getElementById("cval");
    var d=cd?cd.value:"",ty=ct?ct.value:"p",val=cv?cv.value.trim():"";
    if(!d){alert("请选择日期");return;}
    if(ty==="bbt"&&!num(val)){alert("基础体温请填数字，例如 36.4");return;}
    if(ty==="lh"&&!val){alert("试纸结果请填：弱阳 / 强阳 / 转弱");return;}
    if(ty==="p")S.periods.push(d);
    else if(ty==="pe"){S.pe=S.pe||[];S.pe.push(d);}
    else if(ty==="lh"){S.lh=S.lh||[];S.lh.push({d:d,v:val});}
    else if(ty==="s"){S.sex=S.sex||[];S.sex.push({d:d,v:val});}
    else if(ty==="bbt"){S.bbt=S.bbt||[];S.bbt.push({d:d,v:val});}
    save();render(true);return;
  }
  if(ds.delc!==undefined){
    var p=ds.delc.split("|"),kind=p[0],idx=Number(p[1]);
    if(!confirm("删除这条记录？"))return;
    if(kind==="p")S.periods.splice(idx,1);
    else if(kind==="pe")(S.pe||[]).splice(idx,1);
    else if(kind==="lh")(S.lh||[]).splice(idx,1);
    else if(kind==="s")(S.sex||[]).splice(idx,1);
    else if(kind==="bbt")(S.bbt||[]).splice(idx,1);
    save();render(true);return;
  }
  if(ds.addtodo!==undefined){
    var nt=document.getElementById("newtodo"),tx=nt?nt.value.trim():"";
    if(!tx)return;
    S.custom.push(tx);save();render(true);return;
  }
  if(ds.export!==undefined){doExport();return;}
  if(ds.import!==undefined){document.getElementById("impFile").click();return;}
  if(ds.print!==undefined){window.print();return;}
  if(ds.clear!==undefined){
    if(!confirm("确定清空所有打卡、周期和复查记录？此操作不可恢复。\n建议先导出备份。"))return;
    if(!confirm("再确认一次：真的清空？"))return;
    try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);}catch(e){}
    clearPhotoDb();
    S=load();render();return;
  }
});

document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="note"){if(state.side!==state.role)return;S.note[state.date]=el.value;saveSoon();}
  if(el.dataset&&el.dataset.tr){S.tests[el.dataset.tr]=S.tests[el.dataset.tr]||{s:"",r:""};S.tests[el.dataset.tr].r=el.value;saveSoon();}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="dayPick"){state.date=el.value;render();}
  if(el.dataset&&el.dataset.tr){S.tests[el.dataset.tr]=S.tests[el.dataset.tr]||{s:"",r:""};S.tests[el.dataset.tr].r=el.value;save();}
});

function doExport(){
  try{
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="健康计划备份-"+today()+".json";
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  }catch(err){alert("导出失败，请换一个浏览器再试。");}
}

document.getElementById("impFile").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      var base={todos:{},check:{},tests:{},weights:[],periods:[],lh:[],sex:[],bbt:[],pe:[],note:{},custom:[],added:[],meals:{}};
      for(var k in base){if(j[k]!==undefined)base[k]=j[k];}
      S=base;save();render();alert("导入完成。");
    }catch(err){alert("这个文件读不出来，请确认是导出的 .json 备份。");}
  };
  r.readAsText(f);
  e.target.value="";
});

document.getElementById("mealFile").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0];
  var t=PHOTO_TARGET;
  e.target.value="";
  if(!f||!t)return;
  if(t.side!==state.role){alert("只读模式不能修改。");return;}
  compressImage(f,function(data){
    var k=photoKey(t.d,t.side,t.meal);
    PHOTO_CACHE[k]=data;
    idbPut(k,data).catch(function(){});
    if(S.meals&&S.meals[t.d]&&S.meals[t.d][t.side]){
      delete S.meals[t.d][t.side][t.meal];save();
    }
    state.manualMeal=null;
    render(true);
  });
});

/* ============ 底栏 ============ */
(function(){
  var tabs=[["today","打卡",IC.today],["plan","计划",IC.plan],["cycle","周期",IC.cycle],["report","报告",IC.report],["more","更多",IC.more]];
  document.getElementById("tabbar").innerHTML=tabs.map(function(t){
    return '<button data-tab="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>';
  }).join("");
})();

render();
window.HEALTH=function(){return {S:S,state:state,render:render,setToday:function(x){TODAY_OVERRIDE=x;},PASS:PASS,TOTAL:TOTAL,data:{FINDINGS:FINDINGS,PHASES:PHASES,DAILY:DAILY,TESTS:TESTS,QUESTIONS:QUESTIONS,RULES:RULES}};};
</script>
